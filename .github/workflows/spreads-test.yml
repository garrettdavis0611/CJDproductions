name: SPREADS Board tests

on:
  push:
    paths: ['spreads/**', '.github/workflows/spreads*.yml']
  pull_request:
    paths: ['spreads/**', '.github/workflows/spreads*.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spreads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: spreads/package-lock.json
      - run: npm ci
      - run: npm test
