<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1322">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CJD Production Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f3f7;
    --card: #ffffff;
    --ink: #101420;
    --ink-soft: #66708a;
    --line: #e4e7ef;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --chip-bg: #edf1fb;
    --chip-ink: #33418f;
    --warn-bg: #fffbeb;
    --warn-ink: #92400e;
    --call-bg: #e9f0fe;
    --call-line: #c6d8f9;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 5px 14px -6px rgba(16,24,40,.1);
    --display: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", -apple-system, sans-serif;
    --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e16;
      --card: #131a28;
      --ink: #f2f4f8;
      --ink-soft: #93a0b9;
      --line: #242e42;
      --accent: #3b82f6;
      --chip-bg: #1c2537;
      --chip-ink: #c7d2fe;
      --warn-bg: #2a2210;
      --warn-ink: #fbbf24;
      --call-bg: #152137;
      --call-line: #2b4470;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 5px 14px -6px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #0c1322, #1b2740);
  }
  .head-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    max-width: 760px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo { height: 46px; width: auto; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  h1 { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #fff; line-height: 1.1; }
  .sub { font-size: 12px; color: rgba(255,255,255,.62); margin-top: 2px; }
  .btns { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
    color: #fff; border-radius: 10px; padding: 9px 13px;
    font-family: var(--body); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px; line-height: 1;
  }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn:active { transform: scale(0.97); }
  .stripe { height: 4px; background: linear-gradient(90deg, #B7962B 0, #B7962B 25%, #C8102E 25%, #C8102E 50%, #1D4ED8 50%, #1D4ED8 75%, #00843D 75%, #00843D 100%); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 0; }
  .banner {
    background: var(--warn-bg); color: var(--warn-ink);
    border-radius: var(--radius); padding: 12px 14px; font-size: 13.5px;
    margin-bottom: 12px; display: none; line-height: 1.45;
  }
  .banner a { color: inherit; font-weight: 700; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #filters { padding-bottom: 6px; }
  .filters::-webkit-scrollbar { display: none; }
  .fchip {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .month-div {
    display: flex; align-items: center; gap: 12px; margin: 22px 2px 12px;
    font-family: var(--display); font-size: 16px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .month-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #list .month-div:first-child { margin-top: 4px; }
  .day-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); margin-bottom: 14px; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .day-card.today { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent), var(--shadow); }
  .day-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .date-badge { width: 47px; flex-shrink: 0; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 5px 0 7px; }
  .date-badge .dow { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .date-badge .dnum { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.05; margin-top: 1px; }
  .day-card.today .date-badge { background: var(--accent); border-color: var(--accent); }
  .day-card.today .date-badge .dow, .day-card.today .date-badge .dnum { color: #fff; }
  .day-meta { min-width: 0; }
  .day-name { font-size: 15.5px; font-weight: 700; }
  .day-date { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .day-tag { margin-left: auto; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; border-radius: 999px; padding: 4px 10px; text-transform: uppercase; }
  .today-tag { color: var(--accent-ink); background: var(--accent); }
  .tmrw-tag { color: var(--accent); border: 1.5px solid var(--accent); }
  .shift { padding: 12px 16px 15px; border-left: 4px solid transparent; }
  .shift + .shift { border-top: 1px dashed var(--line); }
  .team-badge {
    display: inline-block; font-family: var(--display); border-radius: 6px; padding: 3px 9px 4px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    margin-bottom: 7px;
  }
  .ev-title { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: .015em; line-height: 1.1; }
  .ev-loc { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .times { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .time-box {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 7px 12px 8px; min-width: 92px;
  }
  .time-box .lbl { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  .time-box .val { font-size: 15.5px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .time-box.call { background: var(--call-bg); border-color: var(--call-line); }
  .time-box.call .lbl, .time-box.call .val { color: var(--accent); }
  .crew { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .crew-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--chip-bg); color: var(--chip-ink);
    border-radius: 999px; padding: 4px 12px 4px 5px; font-size: 13px; font-weight: 600;
  }
  .crew-chip .av { width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .notes { margin-top: 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; padding: 8px 11px; background: var(--bg); border-radius: 10px; border-left: 3px solid var(--line); }
  .off {
    padding: 10px 16px 14px; font-size: 14px; color: var(--ink-soft);
  }
  .empty { text-align: center; color: var(--ink-soft); padding: 48px 20px; font-size: 15px; line-height: 1.6; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 10px; }
  .stamp { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; color: var(--ink-soft); padding: 18px 0 8px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.45); }
    70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: sp 0.7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>

  var SHEET_ID = "1f87gUR8wuRIukrP7muhQxP0tVa3Ja2RR9eg7xZoSZjk";

  // Team colors — first matching rule wins. Add teams by adding a line.
  var TEAM_COLORS = [
    { re: /legacy/i,                       bg: "#00843D", fg: "#ffffff" }, // Boston Legacy FC — green
    { re: /northeastern|husk/i,            bg: "#C8102E", fg: "#ffffff" }, // Northeastern — red
    { re: /rhode\s*island|rifc/i,          bg: "#1D4ED8", fg: "#ffffff" }, // Rhode Island FC — blue
    { re: /boston\s*college|\bbc\b|eagle/i, bg: "#B7962B", fg: "#241d00" } // BC — gold
  ];
  var NEUTRAL = { bg: "#6b7280", fg: "#ffffff" };
  function teamColor(team) {
    for (var i = 0; i < TEAM_COLORS.length; i++) {
      if (TEAM_COLORS[i].re.test(team)) return TEAM_COLORS[i];
    }
    return NEUTRAL;
  }
  // School / organization groupings for the filter tabs — first match wins.
  var SCHOOLS = [
    { re: /legacy/i,                        label: "Boston Legacy FC" },
    { re: /northeastern|husk/i,             label: "Northeastern" },
    { re: /rhode\s*island|rifc/i,           label: "Rhode Island FC" },
    { re: /boston\s*college|\bbc\b|eagle/i, label: "Boston College" }
  ];
  function schoolOf(team) {
    for (var i = 0; i < SCHOOLS.length; i++) {
      if (SCHOOLS[i].re.test(team)) return SCHOOLS[i].label;
    }
    return team;
  }

  // Crew names always shown as tappable filter chips, even before they're assigned.

  // Stable color per person — roster order first, hash fallback for extra names.
  var PERSON_COLORS = ["#2563eb", "#db2777", "#059669", "#d97706", "#7c3aed", "#0891b2", "#dc2626"];
  function personColor(name) {
    var i = ROSTER.indexOf(name);
    if (i === -1) {
      i = 0;
      for (var k = 0; k < name.length; k++) i = (i * 31 + name.charCodeAt(k)) % 997;
    }
    return PERSON_COLORS[i % PERSON_COLORS.length];
  }

  var EDIT_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
  var CSV_URL  = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv";

    '2026-10-25,Sunday,BC Volleyball,vs Virginia,Margot Connell Recreation Center,11:00 AM,1:00 PM,,,ACC\n' +
    '2026-10-25,Sunday,Northeastern Volleyball,vs Stony Brook,Cabot Center,12:00 PM,2:00 PM,,,CAA\n' +
    '2026-11-07,Saturday,BC Football,vs Florida State,Alumni Stadium,TBD,TBD,,,"Kickoff TBD — TV window, check bceagles.com"\n' +
    '2026-11-08,Sunday,BC Volleyball,vs Syracuse,Margot Connell Recreation Center,11:00 AM,1:00 PM,,,ACC\n' +
    '2026-11-13,Friday,BC Volleyball,vs Florida State,Margot Connell Recreation Center,5:00 PM,7:00 PM,,,ACC\n' +

  document.getElementById("edit-btn").href = EDIT_URL;

  var state = { rows: [], person: null, team: null, live: false, fetchedAt: null };

  // ─── CSV PARSER (handles quoted fields) ────────────────────────────────────
  function parseCSV(text) {
    var rows = [], row = [], cur = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; }
        } else cur += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.some(function (x) { return x.trim() !== ""; })) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(function (x) { return x.trim() !== ""; })) rows.push(row);
    return rows;
  }

  function normalizeHeader(h) {
    return h.toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  // Map flexible header names → fields, so column renames in the sheet still work.
  function toRecords(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(normalizeHeader);
    function idx() {
      for (var a = 0; a < arguments.length; a++) {
        var j = head.indexOf(arguments[a]);
        if (j !== -1) return j;
      }
      return -1;
    }
    var iDate = idx("date"), iDay = idx("day"),
        iTeam = idx("team", "club"),
        iEv = idx("eventjob", "event", "job", "show"),
        iLoc = idx("location", "venue"),
        iCall = idx("calltime", "call"),
        iStart = idx("starttime", "showtime", "start"),
        iEnd = idx("endtime", "end", "out"),
        iWho = idx("whosworking", "crew", "who", "staff", "working"),
        iNotes = idx("notes", "note"),
        iCrew = [idx("crew1"), idx("crew2"), idx("crew3"), idx("crew4"), idx("crew5")];
    var out = [];
    for (var r = 1; r < rows.length; r++) {
      var g = function (j) { return j >= 0 && rows[r][j] != null ? String(rows[r][j]).trim() : ""; };
      var rec = {
        date: g(iDate), day: g(iDay), team: g(iTeam), event: g(iEv), loc: g(iLoc),
        call: g(iCall), start: g(iStart), end: g(iEnd),
        who: g(iWho), notes: g(iNotes)
      };
      var crewNames = iCrew.map(g).filter(Boolean);
      if (crewNames.length) rec.who = rec.who ? rec.who + ", " + crewNames.join(", ") : crewNames.join(", ");
      if (rec.date || rec.event || rec.who) out.push(rec);
      }
    return out;
  }

  function parseDate(s) {
    if (!s) return null;
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) { var y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
    var d = new Date(s);
    return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function fmtDate(d) { return MONTHS[d.getMonth()] + " " + d.getDate(); }
  function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function splitCrew(s) {
    return s.split(/[,;\/]+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────
  function render() {
    var list = document.getElementById("list");
    var rows = state.rows.slice();
    var today = new Date(); today.setHours(0, 0, 0, 0);

    // sort by date; undated rows go last in sheet order
    rows.forEach(function (r) { r._d = parseDate(r.date); });
    rows.sort(function (a, b) {
      if (a._d && b._d) return a._d - b._d;
      if (a._d) return -1;
      if (b._d) return 1;
      return 0;
    });

    // hide games the day after their date passes
    rows = rows.filter(function (r) {
      if (!r._d) return true;
      return (today - r._d) / 86400000 <= 0;
    });

    // school filter chips (top row) + crew name chips (second row)
    var schools = {}, people = {};
    rows.forEach(function (r) {
      if (r.team) schools[schoolOf(r.team)] = 1;
      splitCrew(r.who).forEach(function (p) { people[p] = 1; });
    });
    var schoolNames = Object.keys(schools).sort();
    var fl = document.getElementById("filters");
    fl.innerHTML = "";
    var all = document.createElement("button");
    all.className = "fchip" + (state.team === null && state.person === null ? " on" : "");
    all.textContent = "All";
    all.onclick = function () { state.team = null; state.person = null; render(); };
    fl.appendChild(all);
    schoolNames.forEach(function (t) {
      var c = teamColor(t);
      var b = document.createElement("button");
      b.className = "fchip";
      b.textContent = t;
      if (state.team === t) {
        b.style.background = c.bg; b.style.borderColor = c.bg; b.style.color = c.fg;
      } else {
        b.style.borderColor = c.bg; b.style.color = c.bg;
      }
      b.onclick = function () { state.team = (state.team === t ? null : t); render(); };
      fl.appendChild(b);
    });
    // crew row: roster names always shown, plus any extra names found in the data
    var names = ROSTER.slice();
    Object.keys(people).sort().forEach(function (n) {
      if (names.indexOf(n) === -1) names.push(n);
    });
    var pf = document.getElementById("filters-people");
    pf.innerHTML = "";
    names.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "fchip" + (state.person === n ? " on" : "");
      var pc = personColor(n);
      if (state.person === n) { b.style.background = pc; b.style.borderColor = pc; }
      b.innerHTML = '<span class="pdot" style="background:' + (state.person === n ? "rgba(255,255,255,.85)" : pc) + '"></span>' + esc(n);
      b.onclick = function () { state.person = (state.person === n ? null : n); render(); };
      pf.appendChild(b);
    });

    if (state.team) {
      rows = rows.filter(function (r) { return schoolOf(r.team) === state.team; });
    }
    if (state.person) {
      rows = rows.filter(function (r) { return splitCrew(r.who).indexOf(state.person) !== -1; });
    }

    // group by date string
    var groups = [], byKey = {};
    rows.forEach(function (r) {
      var key = r._d ? r._d.toDateString() : "nodate-" + (r.date || r.event);
      if (!byKey[key]) { byKey[key] = { d: r._d, day: r.day, rows: [] }; groups.push(byKey[key]); }
      byKey[key].rows.push(r);
    });

    var html = "";
    var lastMonth = -1;
    groups.forEach(function (gp) {
      var isToday = sameDay(gp.d, today);
      var isTomorrow = gp.d && !isToday && (gp.d - today) / 86400000 === 1;
      if (gp.d) {
        var mk = gp.d.getFullYear() * 12 + gp.d.getMonth();
        if (mk !== lastMonth) {
          lastMonth = mk;
          html += '<div class="month-div">' + MONTHS_FULL[gp.d.getMonth()] +
                  (gp.d.getFullYear() !== today.getFullYear() ? " " + gp.d.getFullYear() : "") + "</div>";
        }
      }
      var dayName = gp.d ? DAYS[gp.d.getDay()] : (gp.day || "Scheduled");
      html += '<div class="day-card' + (isToday ? " today" : "") + '">';
      html += '<div class="day-head">';
      if (gp.d) {
        html += '<div class="date-badge"><span class="dow">' + DAYS[gp.d.getDay()].slice(0, 3) + '</span><span class="dnum">' + gp.d.getDate() + "</span></div>";
        html += '<div class="day-meta"><div class="day-name">' + esc(dayName) + '</div><div class="day-date">' + fmtDate(gp.d) + "</div></div>";
      } else {
        html += '<div class="day-meta"><div class="day-name">' + esc(dayName) + '</div><div class="day-date">' + esc(gp.rows[0].date || "") + "</div></div>";
      }
      if (isToday) html += '<span class="day-tag today-tag">Today</span>';
      else if (isTomorrow) html += '<span class="day-tag tmrw-tag">Tomorrow</span>';
      html += "</div>";
      gp.rows.forEach(function (r) {
        if (!r.event && !r.who && !r.call) {
          html += '<div class="off">Nothing scheduled</div>';
          return;
        }
        var tc = r.team ? teamColor(r.team) : null;
        html += '<div class="shift"' + (tc ? ' style="border-left-color:' + tc.bg + ';background:linear-gradient(90deg,' + tc.bg + '12,transparent 55%)"' : "") + ">";
        if (r.team) html += '<span class="team-badge" style="background:' + tc.bg + ';color:' + tc.fg + '">' + esc(r.team) + "</span>";
        if (r.event) html += '<div class="ev-title">' + esc(r.event) + "</div>";
        if (r.loc) html += '<div class="ev-loc">📍 ' + esc(r.loc) + "</div>";
        var t = "";
        if (r.call) t += '<div class="time-box call"><div class="lbl">Call</div><div class="val">' + esc(r.call) + "</div></div>";
        if (r.start) t += '<div class="time-box"><div class="lbl">Start</div><div class="val">' + esc(r.start) + "</div></div>";
        if (r.end) t += '<div class="time-box"><div class="lbl">End</div><div class="val">' + esc(r.end) + "</div></div>";
        if (t) html += '<div class="times">' + t + "</div>";
        var crew = splitCrew(r.who);
        if (crew.length) {
          html += '<div class="crew">' + crew.map(function (p) {
            return '<span class="crew-chip"><span class="av" style="background:' + personColor(p) + '">' + esc(p.charAt(0).toUpperCase()) + "</span>" + esc(p) + "</span>";
          }).join("") + "</div>";
        }
        if (r.notes) html += '<div class="notes">' + esc(r.notes) + "</div>";
        html += "</div>";
      });
      html += "</div>";
    });

    if (!groups.length) {
      html = '<div class="empty"><span class="big">📅</span>No upcoming shifts' + (state.person ? " for " + esc(state.person) : "") + '.<br>Tap <b>Edit</b> to add to the schedule.</div>';
    }
    list.innerHTML = html;

    var sub = document.getElementById("range-sub");
    var count = rows.filter(function (r) { return r.event || r.who; }).length;
    sub.textContent = (state.person ? state.person + " · " : "") + count + (count === 1 ? " shift" : " shifts") + " upcoming";

    var st = document.getElementById("stamp");
    st.innerHTML = state.fetchedAt
      ? (state.live
          ? '<span class="live-dot"></span>Live from the schedule sheet · updated ' + state.fetchedAt
          : "Snapshot view · " + state.fetchedAt)
      : "";
  }

  function showBanner(msg) {
    var b = document.getElementById("banner");
    b.innerHTML = msg;
    b.style.display = "block";
  }
  function hideBanner() { document.getElementById("banner").style.display = "none"; }

  // ─── LOAD ──────────────────────────────────────────────────────────────────
  function load() {
    var btn = document.getElementById("refresh-btn");
    btn.innerHTML = '<span class="spin"></span>';
    var done = function () { btn.innerHTML = "↻"; };
    var stampNow = function () {
      var n = new Date();
      var h = n.getHours() % 12 || 12, ap = n.getHours() < 12 ? "AM" : "PM";
      var mi = ("0" + n.getMinutes()).slice(-2);
      return h + ":" + mi + " " + ap;
    };
    fetch(CSV_URL, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        if (/<html/i.test(text)) throw new Error("not csv"); // sheet not link-shared yet
        state.rows = toRecords(parseCSV(text));
        state.live = true;
        state.fetchedAt = stampNow();
        hideBanner();
        render(); done();
      })
      .catch(function () {
        state.rows = toRecords(parseCSV(FALLBACK_CSV));
        state.live = false;
        state.fetchedAt = stampNow();
        showBanner('Couldn’t reach the live sheet from this viewer — showing a saved snapshot. Make sure the sheet’s sharing is set to “Anyone with the link,” or tap <a href="' + EDIT_URL + '" target="_blank" rel="noopener">Open the schedule sheet</a> for the latest.');
        render(); done();
      });
  }

  document.getElementById("refresh-btn").onclick = load;
  load();
})();
</script>
