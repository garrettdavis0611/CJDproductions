:root{
  --navy:#0C1626;
  --navy2:#16294a;
  --blue:#54B4E4;
  --blue-lt:#8FDBF7;
  --blue-dk:#245484;
  --pink:#EC2C86;
  --pink-lt:#FF63AC;
  --ink:#08101C;
}
*{margin:0;padding:0;box-sizing:border-box}

.stage{
  width:1080px;height:1920px;position:relative;overflow:hidden;
  background:
    radial-gradient(760px 620px at 50% 12%, rgba(84,180,228,.30), transparent 62%),
    radial-gradient(680px 560px at 88% 66%, rgba(236,44,134,.20), transparent 60%),
    radial-gradient(620px 520px at 8% 88%, rgba(84,180,228,.16), transparent 62%),
    linear-gradient(168deg,#132546 0%, var(--navy) 46%, #070E1A 100%);
  font-family:'Inter',sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 54px 34px;
}

/* diagonal speed stripes + vignette, echoing the logo's motion lines */
.stage::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 3px,transparent 3px 34px);
  pointer-events:none;
}
.stage::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(120% 78% at 50% 42%, transparent 52%, rgba(3,8,16,.72) 100%);
  pointer-events:none;
}
.stage > *{position:relative;z-index:2}

/* ---------- logo ---------- */
.logo{
  width:660px;display:block;
  filter:drop-shadow(0 0 34px rgba(84,180,228,.55)) drop-shadow(0 14px 26px rgba(0,0,0,.55));
}

/* ---------- headline ---------- */
.kicker{
  margin-top:14px;
  font-weight:900;font-size:34px;letter-spacing:.30em;text-indent:.30em;
  color:var(--pink-lt);text-transform:uppercase;
  text-shadow:0 0 22px rgba(236,44,134,.65);
}
.headline{
  font-family:'Anton',sans-serif;font-size:190px;line-height:.86;letter-spacing:.005em;
  text-transform:uppercase;color:#fff;margin-top:8px;
  text-shadow:
     4px 4px 0 var(--pink),
     8px 8px 0 rgba(8,16,28,.95),
     0 0 46px rgba(84,180,228,.55);
}
.banner{
  margin-top:20px;transform:skewY(-1.6deg) skewX(-9deg);
  background:linear-gradient(180deg,var(--pink-lt),var(--pink));
  border:3px solid rgba(255,255,255,.92);
  box-shadow:0 10px 0 rgba(8,16,28,.92), 0 18px 40px rgba(236,44,134,.34);
  padding:15px 54px;
}
.banner span{
  display:block;transform:skewX(9deg);
  font-weight:900;font-size:39px;letter-spacing:.17em;text-indent:.17em;
  text-transform:uppercase;color:#fff;text-shadow:0 2px 0 rgba(8,16,28,.5);
}

/* ---------- rate cards ---------- */
.cards{width:100%;margin-top:42px;display:flex;flex-direction:column;gap:18px}
.card{
  background:linear-gradient(165deg,rgba(36,84,132,.56),rgba(8,18,34,.72));
  border:3px solid rgba(84,180,228,.62);
  border-radius:26px;
  box-shadow:0 0 0 2px rgba(8,16,28,.55), 0 22px 46px rgba(0,0,0,.46), inset 0 2px 0 rgba(255,255,255,.10);
  padding:34px 36px 28px;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:14px;margin-bottom:6px;
  border-bottom:3px solid rgba(84,180,228,.34);
}
.card-title{
  font-family:'Anton',sans-serif;font-size:68px;line-height:1;text-transform:uppercase;
  color:var(--blue-lt);letter-spacing:.02em;
  text-shadow:3px 3px 0 rgba(8,16,28,.92), 0 0 26px rgba(84,180,228,.5);
}
.card-note{
  font-weight:800;font-size:23px;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.62);
}

.row{display:flex;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid rgba(143,219,247,.16)}
.row:last-child{border-bottom:0;padding-bottom:2px}
.row-label{
  font-weight:800;font-size:50px;letter-spacing:.01em;color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 rgba(8,16,28,.6);
}
.chip{
  font-weight:900;font-size:19px;letter-spacing:.10em;text-transform:uppercase;
  color:var(--ink);background:linear-gradient(180deg,var(--blue-lt),var(--blue));
  border-radius:999px;padding:6px 15px 7px;white-space:nowrap;
  box-shadow:0 3px 0 rgba(8,16,28,.7);
}
.dots{flex:1;height:0;border-bottom:3px dotted rgba(143,219,247,.34);margin:0 4px}
.pct{
  font-family:'Anton',sans-serif;font-size:84px;line-height:.9;color:#fff;white-space:nowrap;
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 rgba(8,16,28,.9);
}
/* Anton's percent glyph reads as "%o" at display size — set it in Inter instead */
.pct i{
  font-family:'Inter',sans-serif;font-weight:900;font-style:normal;
  font-size:.60em;letter-spacing:-.01em;margin-left:.03em;
}

/* ---------- footer ---------- */
.fine{
  margin-top:36px;width:100%;text-align:center;
  font-weight:600;font-size:26px;line-height:1.5;color:rgba(255,255,255,.66);
}
.fine b{color:rgba(143,219,247,.95);font-weight:800}

.cta{
  margin-top:auto;width:100%;
  background:linear-gradient(180deg,#1E3B68,#0E1E38);
  border:3px solid var(--pink);
  border-radius:20px;
  box-shadow:0 0 34px rgba(236,44,134,.34), inset 0 2px 0 rgba(255,255,255,.10);
  padding:26px 24px;text-align:center;
}
.cta-main{
  font-family:'Anton',sans-serif;font-size:54px;letter-spacing:.03em;text-transform:uppercase;color:#fff;
  text-shadow:3px 3px 0 var(--pink), 0 0 26px rgba(84,180,228,.45);
}
.cta-sub{
  margin-top:10px;font-weight:800;font-size:26px;letter-spacing:.20em;text-indent:.20em;
  text-transform:uppercase;color:var(--blue-lt);
}
</style>
